plugins { id 'com.android.application' }

def secret = { name -> System.getenv(name) }
def hasReleaseKey = ['RG2_SIGNING_STORE_FILE', 'RG2_SIGNING_STORE_PASSWORD',
    'RG2_SIGNING_KEY_ALIAS', 'RG2_SIGNING_KEY_PASSWORD'].every { secret(it) }
def rg2TestBuildType = providers.gradleProperty('rg2TestBuildType').getOrElse('debug')
if (!(rg2TestBuildType in ['debug', 'release'])) {
    throw new GradleException('rg2TestBuildType must be debug or release')
}
if (rg2TestBuildType == 'release' && !hasReleaseKey) {
    throw new GradleException('Release instrumentation requires the canonical release signing environment')
}

android {
    namespace 'io.github.pro007m.rg2'
    compileSdk 36
    buildToolsVersion '36.0.0'
    testBuildType rg2TestBuildType

    defaultConfig {
        applicationId 'io.github.pro007m.rg2'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '1.1.0'
        testInstrumentationRunner 'io.github.pro007m.rg2.OfflineSmokeInstrumentation'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    if (hasReleaseKey) {
        signingConfigs {
            release {
                storeFile file(secret('RG2_SIGNING_STORE_FILE'))
                storePassword secret('RG2_SIGNING_STORE_PASSWORD')
                keyAlias secret('RG2_SIGNING_KEY_ALIAS')
                keyPassword secret('RG2_SIGNING_KEY_PASSWORD')
                storeType 'PKCS12'
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseKey) signingConfig signingConfigs.release
        }
    }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/rg2assets'))
}

androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        if (rg2TestBuildType == 'release' && variant.androidTest != null) {
            if (variant.androidTest.signingConfig == null) {
                throw new GradleException('Release AndroidTest signing is not configured')
            }
            variant.androidTest.signingConfig.setConfig(android.signingConfigs.getByName('release'))
        }
    }
}

tasks.register('syncWebAssets', Sync) {
    from(rootProject.file('../data'))
    into(layout.buildDirectory.dir('generated/rg2assets/www'))
    doFirst {
        if (!rootProject.file('../data/index.html').isFile()) {
            throw new GradleException('The complete offline data/index.html is required.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'syncWebAssets' }

dependencies { implementation 'androidx.webkit:webkit:1.18.0' }
